[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waymark"
version = "0.1.0"
description = "A local-first terminal companion for personal memory, reflection, and decisions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Waymark Contributors" }
]
dependencies = [
  "platformdirs>=4.2",
  "rich>=13.7",
  "typer>=0.12",
  "textual>=0.80"
]

[project.optional-dependencies]
pdf = [
  "pypdf>=4.0"
]
dev = [
  "mypy>=1.10",
  "pypdf>=4.0",
  "pytest>=8.2",
  "ruff>=0.5"
]

[project.scripts]
waymark = "waymark.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

